spring.application.name=Sistema de Rastreabilidade

# Banco local somente para desenvolvimento e aprendizado.
spring.datasource.url=jdbc:h2:file:./data/sistema-rastreabilidade;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Exibe apenas informacoes seguras sobre a saude da aplicacao.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
