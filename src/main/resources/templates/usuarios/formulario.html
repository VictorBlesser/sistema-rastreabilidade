<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar usuário | Sistema de Rastreabilidade</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header th:replace="~{fragments/barra-superior :: barraSuperior}"></header>

    <main class="container container-form">
        <nav class="breadcrumb" aria-label="Navegação estrutural">
            <a th:href="@{/}">Início</a>
            <span aria-hidden="true">/</span>
            <a th:href="@{/usuarios}">Usuários</a>
            <span aria-hidden="true">/</span>
            <span>Novo</span>
        </nav>

        <p class="tag">Módulo de usuários</p>
        <h1>Cadastrar usuário</h1>
        <p class="intro">Os campos marcados com asterisco são obrigatórios.</p>

        <form class="form panel" th:action="@{/usuarios}"
              th:object="${usuarioForm}" method="post" novalidate>

            <div class="alert alert-danger" role="alert"
                 th:if="${#fields.hasAnyErrors()}">
                <p>Revise os dados e digite novamente a senha.</p>
                <p th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></p>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="nome">Nome *</label>
                    <input id="nome" type="text" th:field="*{nome}"
                           maxlength="150" autocomplete="name" required
                           th:classappend="${#fields.hasErrors('nome')} ? ' input-error'"
                           aria-describedby="nome-erro">
                    <span id="nome-erro" class="field-error"
                          th:if="${#fields.hasErrors('nome')}"
                          th:errors="*{nome}"></span>
                </div>

                <div class="field">
                    <label for="login">Login *</label>
                    <input id="login" type="text" th:field="*{login}"
                           maxlength="100" autocomplete="username" required
                           th:classappend="${#fields.hasErrors('login')} ? ' input-error'"
                           aria-describedby="login-erro">
                    <span id="login-erro" class="field-error"
                          th:if="${#fields.hasErrors('login')}"
                          th:errors="*{login}"></span>
                </div>

                <div class="field">
                    <label for="senha">Senha *</label>
                    <input id="senha" name="senha" type="password"
                           autocomplete="new-password" required
                           th:classappend="${#fields.hasErrors('senha')} ? ' input-error'"
                           aria-describedby="senha-erro">
                    <span id="senha-erro" class="field-error"
                          th:if="${#fields.hasErrors('senha')}"
                          th:errors="*{senha}"></span>
                </div>

                <div class="field">
                    <label for="perfil">Perfil *</label>
                    <select id="perfil" th:field="*{perfil}" required
                            th:classappend="${#fields.hasErrors('perfil')} ? ' input-error'"
                            aria-describedby="perfil-erro">
                        <option value="">Selecione um perfil</option>
                        <option th:each="perfil : ${perfis}"
                                th:value="${perfil}"
                                th:text="${#strings.replace(perfil.name(), '_', ' ')}"></option>
                    </select>
                    <span id="perfil-erro" class="field-error"
                          th:if="${#fields.hasErrors('perfil')}"
                          th:errors="*{perfil}"></span>
                </div>
            </div>

            <div class="form-actions">
                <a class="button button-ghost" th:href="@{/usuarios}">Cancelar</a>
                <button class="button" type="submit">Salvar usuário</button>
            </div>
        </form>
    </main>
</body>
</html>
