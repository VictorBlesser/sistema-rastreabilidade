<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recebimentos | Sistema de Rastreabilidade</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header th:replace="~{fragments/barra-superior :: barraSuperior}"></header>

    <main class="container">
        <div class="page-header">
            <div>
                <p class="tag">Recebimento</p>
                <h1>Recebimentos cadastrados</h1>
                <p class="intro">Consulte os recebimentos e suas entradas no estoque.</p>
            </div>

            <a class="button"
               sec:authorize="hasAuthority('RECEBIMENTO_CRIAR')"
               th:href="@{/recebimentos/novo}">
                Novo recebimento
            </a>
        </div>

        <div class="alert alert-success" role="status"
             th:if="${mensagemSucesso}" th:text="${mensagemSucesso}">
        </div>

        <div class="alert alert-danger" role="alert"
             th:if="${mensagemErro}" th:text="${mensagemErro}">
        </div>

        <section class="panel" aria-label="Lista de recebimentos">
            <div class="empty-state" th:if="${#lists.isEmpty(recebimentos)}">
                <strong>Nenhum recebimento cadastrado</strong>
                <p>Os recebimentos cadastrados aparecerão nesta lista.</p>
            </div>

            <div class="table-wrapper" th:unless="${#lists.isEmpty(recebimentos)}">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Documento</th>
                            <th scope="col">Fornecedor</th>
                            <th scope="col">Data</th>
                            <th scope="col">Situação</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="recebimento : ${recebimentos}">
                            <td th:text="${recebimento.documento}"></td>
                            <td th:text="${recebimento.fornecedor}"></td>
                            <td th:text="${#temporals.format(
                                recebimento.dataRecebimento, 'dd/MM/yyyy')}">
                            </td>
                            <td th:text="${recebimento.rascunho
                                ? 'Rascunho' : 'Confirmado'}">
                            </td>
                            <td>
                                <a class="button button-ghost"
                                   th:href="@{/recebimentos/{id}(id=${recebimento.id})}">
                                    Ver detalhes
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
