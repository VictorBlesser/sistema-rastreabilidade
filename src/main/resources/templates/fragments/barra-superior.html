<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <header class="topbar" th:fragment="barraSuperior">
        <a class="topbar__brand" th:href="@{/}">
            <strong>Sistema genérico</strong>
            <span>Sistema de ERP</span>
        </a>

        <nav class="topbar__modules" aria-label="Módulos do sistema">
            <a th:href="@{/}">Início</a>

            <a th:href="@{/produtos}"
               sec:authorize="hasAuthority('PRODUTO_VISUALIZAR')">
                Produtos
            </a>

            <a th:href="@{/usuarios}"
               sec:authorize="hasAuthority('USUARIO_VISUALIZAR')">
                Usuários
            </a>

            <a th:href="@{/lotes}"
               sec:authorize="hasAuthority('LOTE_VISUALIZAR')">
                Lotes
            </a>

            <a th:href="@{/recebimentos}"
               sec:authorize="hasAuthority('RECEBIMENTO_VISUALIZAR')">
                Recebimento
            </a>

            <a th:href="@{/estoque}"
               sec:authorize="hasAuthority('ESTOQUE_QUANTIDADE_FISICA_VISUALIZAR')">
                Estoque
            </a>

            <a th:href="@{/expedicoes}"
               sec:authorize="hasAuthority('EXPEDICAO_VISUALIZAR')">
                Expedição
            </a>

            <a th:href="@{/rastreabilidade}"
               sec:authorize="hasAuthority('RASTREABILIDADE_VISUALIZAR')">
                Rastreabilidade
            </a>
        </nav>

        <div class="topbar__user" sec:authorize="isAuthenticated()">
            <span sec:authentication="name">Usuário</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit">Sair</button>
            </form>
        </div>
    </header>
</body>
</html>
