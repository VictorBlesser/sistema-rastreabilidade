<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lotes | Sistema de Rastreabilidade</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
    <header th:replace="~{fragments/barra-superior :: barraSuperior}"></header>

    <main class="container">
        <nav class="breadcrumb" aria-label="Navegação estrutural">
            <a th:href="@{/}">Início</a>
            <span aria-hidden="true">/</span>
            <span>Lotes</span>
        </nav>

        <div class="page-header">
            <div>
                <p class="tag">Módulo de lotes</p>
                <h1>Lotes cadastrados</h1>
                <p class="intro">Consulte os lotes de cada produto e suas datas.</p>
            </div>
            <a class="button" th:href="@{/lotes/novo}">Cadastrar lote</a>
        </div>

        <div class="alert alert-success" role="status"
             th:if="${mensagemSucesso}" th:text="${mensagemSucesso}"></div>

        <div class="alert alert-danger" role="alert"
             th:if="${mensagemErro}" th:text="${mensagemErro}"></div>

        <section class="panel" aria-label="Lista de lotes">
            <div class="empty-state" th:if="${#lists.isEmpty(lotes)}">
                <strong>Nenhum lote cadastrado</strong>
                <p>Cadastre um lote para um produto com controle de lote.</p>
                <a class="button button-secondary" th:href="@{/lotes/novo}">
                    Cadastrar primeiro lote
                </a>
            </div>

            <div class="table-wrapper" th:unless="${#lists.isEmpty(lotes)}">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Produto</th>
                            <th scope="col">Lote</th>
                            <th scope="col">Fabricação</th>
                            <th scope="col">Validade</th>
                            <th scope="col">Situação</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="lote : ${lotes}">
                            <td th:text="${lote.produto.nome}"></td>
                            <td class="code" th:text="${lote.numero}"></td>
                            <td th:text="${lote.dataFabricacao != null
                                ? #temporals.format(lote.dataFabricacao, 'dd/MM/yyyy')
                                : 'Não informada'}"></td>
                            <td th:text="${lote.dataValidade != null
                                ? #temporals.format(lote.dataValidade, 'dd/MM/yyyy')
                                : 'Não informada'}"></td>
                            <td>
                                <span class="status"
                                      th:classappend="${lote.ativo} ? ' status-active' : ' status-inactive'"
                                      th:text="${lote.ativo ? 'Ativo' : 'Inativo'}"></span>
                            </td>
                            <td>
                                <a class="button button-ghost"
                                   th:href="@{/lotes/{id}(id=${lote.id})}">
                                    Ver detalhes
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
