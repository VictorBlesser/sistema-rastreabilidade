<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema de Rastreabilidade</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
    <main class="container">
        <p class="tag">Projeto demonstrativo</p>
        <h1>Rastreabilidade e qualidade</h1>
        <p class="intro">Este é um sistema demonstrativo de rastreabilidade.</p>

        <div class="actions">
            <a class="button" th:href="@{/produtos}">Acessar produtos</a>
        </div>

        <section class="card">
            <span>Etapa atual</span>
            <strong th:text="${etapaAtual}">Fundação do sistema</strong>
        </section>

        <section>
            <h2>Próximos módulos</h2>
            <div class="grid">
                <article><b>01</b><span>Usuários e permissões</span></article>
                <article><b>02</b><span>Produtos e lotes — em desenvolvimento</span></article>
                <article><b>03</b><span>Recebimento e estoque</span></article>
                <article><b>04</b><span>Rastreabilidade e auditoria</span></article>
            </div>
        </section>
    </main>
</body>
</html>
